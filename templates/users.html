<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
</head>
<body>
    <h1>All Users</h1>

    {% if users %}
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>User ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Date Joined</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.user_id }}</td>
                <td><input name="first_name" value="{{ user.first_name }}" form="edit-user-{{ user.user_id }}" required /></td>
                <td><input name="last_name" value="{{ user.last_name }}" form="edit-user-{{ user.user_id }}" required /></td>
                <td><input type="email" name="email" value="{{ user.email or '' }}" form="edit-user-{{ user.user_id }}" /></td>
                <td>{{ user.date_joined or '' }}</td>
                <td>
                    <form id="edit-user-{{ user.user_id }}" action="{{ url_for('main.edit_user', user_id=user.user_id) }}" method="POST" style="display:inline;">
                        <button type="submit">Update</button>
                    </form>
                    <form action="{{ url_for('main.delete_user', user_id=user.user_id) }}" method="POST" style="display:inline;">
                        <button type="submit" onclick="return confirm('Are you sure you want to delete this user?')">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% else %}
    <p>No users found in the database</p>
    {% endif %}

    <h2>Add New Member</h2>
    <form action="{{ url_for('main.add_user_from_users_page') }}" method="POST">
        <table border="1" cellpadding="8" cellspacing="0">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><input name="first_name" required /></td>
                    <td><input name="last_name" required /></td>
                    <td><input type="email" name="email" /></td>
                </tr>
            </tbody>
        </table>
        <button type="submit">Add Member</button>
    </form>
</body>
</html>
